<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Haber Bandı</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-app-region: drag;
  }
  .ticker-container {
    width: 100%;
    height: 90px;
    background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 100%);
    display: flex;
    align-items: center;
    border-top: 3px solid #e63946;
    position: relative;
  }
  .ticker-label {
    background: #e63946;
    color: #fff;
    font-weight: bold;
    font-size: 20px;
    padding: 0 24px;
    height: 100%;
    display: flex;
    align-items: center;
    letter-spacing: 1px;
    flex-shrink: 0;
    z-index: 2;
    -webkit-app-region: no-drag;
  }
  .ticker-track {
    flex: 1;
    height: 100%;
    overflow: hidden;
    position: relative;
    -webkit-app-region: no-drag;
  }
  .ticker-content {
    display: flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    position: absolute;
    animation: scroll-left 40s linear infinite;
  }
  .ticker-content:hover {
    animation-play-state: paused;
  }
  @keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
  .news-item {
    display: inline-flex;
    align-items: center;
    color: #ffffff;
    font-size: 22px;
    padding: 0 40px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .news-item:hover {
    color: #ffd60a;
  }
  .news-source {
    background: #415a77;
    color: #e0e1dd;
    font-size: 13px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 4px;
    margin-right: 12px;
  }
  .close-btn {
    position: absolute;
    top: 4px;
    right: 8px;
    color: #778da9;
    font-size: 18px;
    cursor: pointer;
    z-index: 3;
    -webkit-app-region: no-drag;
  }
  .close-btn:hover { color: #fff; }
</style>
</head>
<body>

<div class="ticker-container">
  <div class="close-btn" id="closeBtn">✕</div>
  <div class="ticker-label">🔴 CANLI</div>
  <div class="ticker-track">
    <div class="ticker-content" id="tickerContent">
      <span class="news-item">Haberler yükleniyor...</span>
    </div>
  </div>
</div>

<script>
  const tickerContent = document.getElementById("tickerContent");
  const closeBtn = document.getElementById("closeBtn");

  closeBtn.addEventListener("click", () => {
    window.api.closeTickerWindow();
  });

   const CATEGORY_COLORS = {
    "Gündem": "#f97316", "Spor": "#22c55e", "Ekonomi": "#3b82f6",
    "Dünya": "#a855f7", "Teknoloji": "#06b6d4", "Magazin": "#ec4899",
    "Sağlık": "#ef4444", "Politika": "#6b7280", "Genel": "#94a3b8"
  };
  const AUTO_COLOR_PALETTE = ["#eab308", "#14b8a6", "#8b5cf6", "#f43f5e", "#0ea5e9", "#84cc16", "#d946ef", "#f59e0b"];
  const autoColorCache = {};
  function getCategoryColor(category) {
    const name = category || "Genel";
    if (CATEGORY_COLORS[name]) return CATEGORY_COLORS[name];
    if (autoColorCache[name]) return autoColorCache[name];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % AUTO_COLOR_PALETTE.length;
    const color = AUTO_COLOR_PALETTE[Math.abs(hash) % AUTO_COLOR_PALETTE.length];
    autoColorCache[name] = color;
    return color;
  }
  function renderNews(newsList) {
    if (!newsList || newsList.length === 0) {
      tickerContent.innerHTML = '<span class="news-item">Gösterilecek haber bulunamadı.</span>';
      return;
    }

    tickerContent.innerHTML = "";
    newsList.forEach((news) => {
      const item = document.createElement("span");
      item.className = "news-item";
      const catColor = getCategoryColor(news.category);
      item.innerHTML = `<span class="news-source" style="background:${catColor};">${news.sourceName || ""}</span> ${news.title}`;
      item.addEventListener("click", () => {
        if (news.link) window.api.openNewsLink(news.link);
      });
      tickerContent.appendChild(item);
    });

    // Animasyon suresini haber sayisina gore ayarla
    const baseDuration = Math.max(30, newsList.length * 6);
    const duration = baseDuration * getSpeedMultiplier(currentSpeed);
    tickerContent.style.animation = `scroll-left ${duration}s linear infinite`;
  }

  let currentSpeed = "normal";

  function getSpeedMultiplier(speed) {
    if (speed === "slow") return 1.6;
    if (speed === "fast") return 0.6;
    return 1;
  }

 async function loadNews() {
  try {
    const tickerSettings = await window.api.getTickerSettings();
    currentSpeed = tickerSettings.speed || "normal";

    const news = await window.api.getTickerNews({ sourceIds: tickerSettings.sourceIds || [] });
    renderNews(news);
  } catch (err) {
    tickerContent.innerHTML = '<span class="news-item">Haberler yüklenirken hata oluştu.</span>';
    console.error("Ticker haber yukleme hatasi:", err);
  }
}


  loadNews();
  setInterval(loadNews, 5 * 60 * 1000); // 5 dakikada bir yenile
</script>

</body>
</html>
