<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haber Takip Web Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .ad-skyscraper {
      width: 160px;
      min-width: 160px;
      height: 600px;
      position: sticky;
      top: 85px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Üst Bar -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-6 py-3.5 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500/20 p-2 rounded-lg border border-emerald-500/30">
          <i class="fa-solid fa-bolt text-emerald-400 text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
            Haber Takip <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Canlı Akış</span>
          </h1>
          <p class="text-[11px] text-slate-400">Geliş saatine göre anlık sıralama</p>
        </div>
      </div>

      <!-- Arama, Butonlar ve Admin Girişi -->
      <div class="flex items-center gap-2 flex-1 max-w-xl">
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="Başlık veya özette ara..." class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
        </div>
        <button id="refreshBtn" title="Listeyi Tazele" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i>
          <span class="hidden sm:inline">Yenile</span>
        </button>
        <button id="exportWordBtn" title="Seçili veya tüm haberleri Word olarak aktar" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-sm whitespace-nowrap">
          <i class="fa-solid fa-file-word"></i>
          <span id="exportBtnText">Word İndir</span>
        </button>
        <a href="/admin.html" title="Admin & Personel Paneli" class="bg-slate-700 hover:bg-slate-600 text-amber-400 border border-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-lock"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Filtreleme & Takip Kontrol Paneli -->
  <div class="bg-slate-850 bg-slate-800/50 border-b border-slate-800 px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- Kaynak Seçimi -->
      <div class="flex items-center gap-2 flex-wrap text-xs">
        <span class="text-slate-400 font-medium flex items-center gap-1"><i class="fa-solid fa-filter text-emerald-400"></i> Kaynaklar:</span>
        <div id="sourcesFilter" class="flex items-center gap-1.5 flex-wrap">
          <span class="text-xs text-slate-500">Yükleniyor...</span>
        </div>
      </div>

      <!-- Kelime Takip & Alarm -->
      <div class="flex items-center gap-2 text-xs">
        <span class="text-amber-400 font-medium flex items-center gap-1"><i class="fa-solid fa-bell"></i> Alarm Kelimeleri:</span>
        <input type="text" id="watchWordsInput" placeholder="örn: deprem, dolar, borsa (virgülle)" class="bg-slate-950 border border-slate-700 rounded-md px-2.5 py-1 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-500 w-52">
      </div>
    </div>
  </div>

  <!-- Ana Düzen: SOL REKLAM + HABERLER + SAĞ REKLAM -->
  <div class="flex-1 max-w-[1550px] w-full mx-auto px-4 py-6 flex gap-6 justify-center items-start">
    
    <!-- SOL REKLAM KULESİ -->
    <aside id="leftAdContainer" class="hidden xl:flex ad-skyscraper flex-col justify-center items-center bg-slate-800/40 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
      <span class="text-[10px] text-slate-600 mb-1">REKLAM</span>
      <div id="leftAdContent" class="w-full h-full flex items-center justify-center p-1"></div>
    </aside>

    <!-- ORTA HABER İÇERİĞİ -->
    <main class="flex-1 max-w-5xl w-full">
      <div class="flex flex-wrap justify-between items-center mb-5 gap-3 text-xs text-slate-400">
        <div class="flex items-center gap-3">
          <span id="newsCount" class="font-semibold text-slate-300">Yükleniyor...</span>
          <span id="alarmBadge" class="hidden bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30 animate-pulse font-medium"></span>
          
          <button id="toggleSelectAllBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1 rounded text-xs transition flex items-center gap-1.5">
            <i class="fa-regular fa-square-check text-emerald-400"></i>
            <span id="toggleSelectAllText">Tümünü Seç</span>
          </button>
        </div>

        <button id="syncRssBtn" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-cloud-arrow-down" id="syncIcon"></i>
          <span id="syncText">Kaynakları Tara</span>
        </button>
      </div>

      <div id="statusAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium transition"></div>

      <!-- Haber Grid -->
      <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-5"></div>
    </main>

    <!-- SAĞ REKLAM KULESİ -->
    <aside id="rightAdContainer" class="hidden xl:flex ad-skyscraper flex-col justify-center items-center bg-slate-800/40 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
      <span class="text-[10px] text-slate-600 mb-1">REKLAM</span>
      <div id="rightAdContent" class="w-full h-full flex items-center justify-center p-1"></div>
    </aside>

  </div>

  <script>
    let currentNewsList = [];
    let selectedSources = new Set();
    let selectedNewsGuids = new Set();
    let searchTimeout;

    const watchInput = document.getElementById('watchWordsInput');
    watchInput.value = localStorage.getItem('haber_watch_words') || '';
    watchInput.addEventListener('change', () => {
      localStorage.setItem('haber_watch_words', watchInput.value.trim());
      renderNews();
    });

    const grid = document.getElementById('newsGrid');
    const countText = document.getElementById('newsCount');
    const alarmBadge = document.getElementById('alarmBadge');
    const syncBtn = document.getElementById('syncRssBtn');
    const syncIcon = document.getElementById('syncIcon');
    const syncText = document.getElementById('syncText');
    const statusAlert = document.getElementById('statusAlert');
    const sourcesContainer = document.getElementById('sourcesFilter');
    const exportBtnText = document.getElementById('exportBtnText');
    const toggleSelectAllBtn = document.getElementById('toggleSelectAllBtn');
    const toggleSelectAllText = document.getElementById('toggleSelectAllText');

    function showAlert(message, type = 'info') {
      statusAlert.className = `mb-4 p-3 rounded-xl text-xs font-medium transition flex items-center gap-2 ${
        type === 'success' ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300' :
        type === 'error' ? 'bg-rose-500/10 border border-rose-500/30 text-rose-300' :
        'bg-blue-500/10 border border-blue-500/30 text-blue-300'
      }`;
      statusAlert.innerHTML = message;
      statusAlert.classList.remove('hidden');
      setTimeout(() => statusAlert.classList.add('hidden'), 5000);
    }

    function playAlertBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // Linkten domain ayıklayıp Google favicon servisine yönlendiren yardımcı
    function getFaviconUrl(linkUrl) {
      try {
        const parsed = new URL(linkUrl);
        return `https://www.google.com/s2/favicons?domain=${parsed.hostname}&sz=64`;
      } catch (e) {
        return 'https://placehold.co/32x32/1e293b/10b981?text=N';
      }
    }

    function updateExportButtonState() {
      const count = selectedNewsGuids.size;
      exportBtnText.textContent = count > 0 ? `Word İndir (${count} Seçili)` : 'Word İndir';
      toggleSelectAllText.textContent = (currentNewsList.length > 0 && selectedNewsGuids.size === currentNewsList.length) ? 'Seçimi Kaldır' : 'Tümünü Seç';
    }

    toggleSelectAllBtn.addEventListener('click', () => {
      if (selectedNewsGuids.size === currentNewsList.length) {
        selectedNewsGuids.clear();
      } else {
        currentNewsList.forEach(n => selectedNewsGuids.add(n.guid));
      }
      renderNews();
    });

    // Kaynakları Yükle
    async function loadSources() {
      try {
        const res = await fetch('/api/sources');
        const data = await res.json();
        if (data.success && data.data.length > 0) {
          const activeSources = data.data.filter(s => s.isActive);
          sourcesContainer.innerHTML = activeSources.map(src => {
            selectedSources.add(src.name);
            return `
              <button data-src="${src.name}" class="source-chip bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full hover:opacity-80 transition flex items-center gap-1">
                <span>${src.name}</span>
                <i class="fa-solid fa-check text-[10px]"></i>
              </button>
            `;
          }).join('');

          document.querySelectorAll('.source-chip').forEach(btn => {
            btn.addEventListener('click', () => {
              const src = btn.getAttribute('data-src');
              if (selectedSources.has(src)) {
                selectedSources.delete(src);
                btn.className = 'source-chip bg-slate-800 text-slate-500 border border-slate-700 px-2.5 py-0.5 rounded-full hover:opacity-80 transition flex items-center gap-1';
                btn.querySelector('i').className = 'fa-solid fa-xmark text-[10px]';
              } else {
                selectedSources.add(src);
                btn.className = 'source-chip bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full hover:opacity-80 transition flex items-center gap-1';
                btn.querySelector('i').className = 'fa-solid fa-check text-[10px]';
              }
              loadNews();
            });
          });
        }
      } catch (e) {}
    }

    // Haberleri Ekrana Çiz
    function renderNews() {
      countText.textContent = `Toplam ${currentNewsList.length} haber listeleniyor.`;
      updateExportButtonState();

      const watchKeywords = watchInput.value.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
      let matchedAlarmCount = 0;

      if (currentNewsList.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500">
            <i class="fa-regular fa-folder-open text-4xl mb-3 block text-slate-600"></i>
            <p class="text-sm text-slate-400">Gösterilecek haber bulunamadı.</p>
          </div>`;
        alarmBadge.classList.add('hidden');
        return;
      }

      grid.innerHTML = currentNewsList.map((item) => {
        const itemText = `${item.title} ${item.description || ''}`.toLowerCase();
        const hasAlarm = watchKeywords.some(kw => itemText.includes(kw));
        if (hasAlarm) matchedAlarmCount++;

        const isChecked = selectedNewsGuids.has(item.guid);
        const dateObj = new Date(item.pubDate || item.createdAt);
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = dateObj.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const faviconSrc = getFaviconUrl(item.link);

        return `
          <article class="relative bg-slate-800/80 border ${isChecked ? 'border-emerald-500 bg-slate-800 ring-2 ring-emerald-500/40' : (hasAlarm ? 'border-amber-500/80 bg-amber-950/20 ring-1 ring-amber-500/50' : 'border-slate-700/60')} rounded-xl p-4 hover:border-slate-500 transition-all flex flex-col justify-between group shadow-md">
            
            <!-- Seçenek / Checkbox & Saat Satırı -->
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-700/60">
              <label class="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" data-guid="${item.guid}" class="news-select-chk w-4 h-4 rounded text-emerald-500 bg-slate-900 border-slate-600 focus:ring-emerald-500 cursor-pointer" ${isChecked ? 'checked' : ''}>
                <span class="text-[11px] font-medium ${isChecked ? 'text-emerald-400 font-bold' : 'text-slate-400'}">Seç</span>
              </label>
              <span class="font-mono text-emerald-300 font-semibold text-[11px] flex items-center gap-1">
                <i class="fa-regular fa-clock text-[10px]"></i> ${timeStr}
              </span>
            </div>

            <!-- Kaynak Başlığı ve Orta Boy Logo -->
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center overflow-hidden p-1 shadow-inner shrink-0">
                    <img src="${faviconSrc}" alt="${item.source}" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/32x32/1e293b/10b981?text=N'">
                  </div>
                  <span class="bg-slate-700/80 px-2 py-0.5 rounded font-bold text-xs text-emerald-400 border border-slate-600/50 truncate max-w-[150px]">${item.source || 'Genel'}</span>
                </div>
                <span class="text-slate-500 text-[10px] whitespace-nowrap">${dateStr}</span>
              </div>
              
              <h2 class="text-sm font-semibold text-slate-100 group-hover:text-emerald-400 transition line-clamp-2 mb-2 leading-snug">
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
              </h2>
              
              ${item.description ? `<p class="text-xs text-slate-400 line-clamp-3 mb-3 leading-relaxed">${item.description.replace(/<[^>]*>?/gm, '')}</p>` : ''}
            </div>

            <!-- Alt Kısım: Alarm & Link -->
            <div class="pt-2 border-t border-slate-700/50 flex justify-between items-center text-[11px] text-slate-400">
              <div>
                ${hasAlarm ? '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded font-semibold border border-amber-500/30">⚠️ ALARM</span>' : ''}
              </div>
              <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-slate-300 hover:text-emerald-400 font-medium inline-flex items-center gap-1 transition">
                Habere Git <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
              </a>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.news-select-chk').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const guid = e.target.getAttribute('data-guid');
          if (e.target.checked) selectedNewsGuids.add(guid);
          else selectedNewsGuids.delete(guid);
          renderNews();
        });
      });

      if (matchedAlarmCount > 0) {
        alarmBadge.textContent = `${matchedAlarmCount} Takip Edilen Haber!`;
        alarmBadge.classList.remove('hidden');
        playAlertBeep();
      } else {
        alarmBadge.classList.add('hidden');
      }
    }

    // Haberleri API'den Çek
    async function loadNews() {
      try {
        let url = `/api/news?limit=120`;
        const search = document.getElementById('searchInput').value.trim();
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (selectedSources.size > 0) url += `&sources=${Array.from(selectedSources).join(',')}`;

        const res = await fetch(url);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Veri çekilemedi');

        currentNewsList = data.data || [];
        renderNews();
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-rose-400 text-xs">Hata: ${err.message}</div>`;
      }
    }

    // Word İndir
    document.getElementById('exportWordBtn').addEventListener('click', () => {
      if (!currentNewsList || currentNewsList.length === 0) {
        showAlert('Dışa aktarılacak haber bulunamadı!', 'error');
        return;
      }

      let exportItems = selectedNewsGuids.size > 0 
        ? currentNewsList.filter(n => selectedNewsGuids.has(n.guid))
        : currentNewsList;

      let content = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset='utf-8'>
          <title>Haber Takip Raporu</title>
          <style>
            body { font-family: 'Segoe UI', Calibri, Arial, sans-serif; padding: 25px; color: #1e293b; }
            h1 { font-size: 20pt; color: #0f172a; border-bottom: 2px solid #10b981; padding-bottom: 8px; margin-bottom: 4px; }
            .meta { font-size: 9.5pt; color: #64748b; margin-bottom: 25px; }
            .item { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
            .title { font-size: 13pt; font-weight: bold; color: #0f172a; margin-top: 6px; margin-bottom: 6px; }
            .badge { font-size: 8.5pt; font-weight: bold; background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; }
            .date { font-size: 8.5pt; color: #059669; font-weight: 600; margin-left: 10px; }
            .desc { font-size: 10pt; color: #334155; line-height: 1.5; margin: 8px 0; }
            .link { font-size: 9pt; color: #2563eb; text-decoration: underline; word-break: break-all; }
          </style>
        </head>
        <body>
          <h1>Haber Takip - Seçilen Haberler Raporu</h1>
          <div class="meta">Rapor Tarihi: ${new Date().toLocaleString('tr-TR')} | Aktarılan Haber Sayısı: <strong>${exportItems.length}</strong></div>
      `;

      exportItems.forEach((n, idx) => {
        const cleanDesc = (n.description || '').replace(/<[^>]*>?/gm, '');
        const dateStr = new Date(n.pubDate || n.createdAt).toLocaleString('tr-TR');
        content += `
          <div class="item">
            <div>
              <span class="badge">${n.source || 'Genel'}</span>
              <span class="date">${dateStr}</span>
            </div>
            <div class="title">${idx + 1}. ${n.title}</div>
            ${cleanDesc ? `<div class="desc">${cleanDesc}</div>` : ''}
            <div><a class="link" href="${n.link}">Habere Git: ${n.link}</a></div>
          </div>
        `;
      });

      content += `</body></html>`;

      const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Haber_Raporu_${exportItems.length}_Adet_${new Date().toISOString().slice(0, 10)}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showAlert(`${exportItems.length} adet haber başarıyla Word olarak indirildi!`, 'success');
    });

    // Reklamları Yükleme Fonksiyonu
    async function loadBannerAds() {
      try {
        const res = await fetch('/api/ads');
        const data = await res.json();
        if (data.success) {
          data.data.forEach(ad => {
            const container = document.getElementById(`${ad.position}AdContainer`);
            const content = document.getElementById(`${ad.position}AdContent`);
            if (!container || !content) return;

            if (!ad.isActive) {
              container.classList.add('opacity-0', 'pointer-events-none');
              return;
            }
            container.classList.remove('opacity-0', 'pointer-events-none');
            
            if (ad.type === 'code' && ad.code) {
              content.innerHTML = ad.code;
            } else if (ad.imageUrl) {
              content.innerHTML = `
                <a href="${ad.targetUrl || '#'}" target="_blank" rel="noopener noreferrer" class="block w-full h-full">
                  <img src="${ad.imageUrl}" alt="Reklam" class="w-full h-full object-cover rounded-lg hover:opacity-90 transition">
                </a>
              `;
            }
          });
        }
      } catch (e) {}
    }

    // Arama Girişi
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(loadNews, 300);
    });

    // Yenile Butonu
    document.getElementById('refreshBtn').addEventListener('click', () => {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');
      loadNews().finally(() => setTimeout(() => icon.classList.remove('fa-spin'), 600));
    });

    // Kaynakları Tara Butonu
    syncBtn.addEventListener('click', async () => {
      syncBtn.disabled = true;
      syncIcon.className = 'fa-solid fa-circle-notch fa-spin';
      syncText.textContent = 'Taranıyor...';
      showAlert('RSS kaynakları taranıyor, lütfen bekleyin...', 'info');

      try {
        await fetch('/api/sync');
        setTimeout(async () => {
          await loadNews();
          syncIcon.className = 'fa-solid fa-cloud-arrow-down';
          syncText.textContent = 'Kaynakları Tara';
          syncBtn.disabled = false;
          showAlert('Kaynaklar güncellendi.', 'success');
        }, 5000);
      } catch (e) {
        syncIcon.className = 'fa-solid fa-triangle-exclamation';
        syncText.textContent = 'Hata!';
        syncBtn.disabled = false;
        showAlert('Tarama hatası: ' + e.message, 'error');
      }
    });

    // Başlangıç
    loadSources();
    loadNews();
    loadBannerAds();
    setInterval(loadNews, 60000);
  </script>
</body>
</html>
