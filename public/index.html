<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haber Takip Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-newspaper text-emerald-400 text-2xl"></i>
      <h1 class="text-xl font-bold tracking-wide">Haber Takip <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Web</span></h1>
    </div>
    <div class="flex items-center gap-3 flex-1 max-w-md">
      <div class="relative w-full">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="Haberlerde ara..." class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
      </div>
      <button id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i>
        <span>Yenile</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6">
    <div class="flex justify-between items-center mb-6 text-sm text-slate-400">
      <span id="newsCount">Yükleniyor...</span>
      <button id="syncRssBtn" class="text-xs text-slate-400 hover:text-emerald-400 underline transition">
        <i class="fa-solid fa-cloud-arrow-down mr-1"></i>Kaynakları Şimdi Tara
      </button>
    </div>
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    let searchTimeout;
    async function loadNews(search = '') {
      const grid = document.getElementById('newsGrid');
      const countText = document.getElementById('newsCount');
      try {
        let url = '/api/news?limit=60';
        if (search) url += '&search=' + encodeURIComponent(search);
        const res = await fetch(url);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        countText.textContent = `Toplam ${data.count} haber listeleniyor.`;
        if (data.data.length === 0) {
          grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500"><i class="fa-regular fa-folder-open text-4xl mb-3"></i><p>Haber bulunamadı. Birazdan kaynaklar taranınca yüklenecektir.</p></div>';
          return;
        }

        grid.innerHTML = data.data.map(item => `
          <article class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 hover:border-slate-600 transition flex flex-col justify-between group shadow-sm">
            <div>
              <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
                <span class="bg-slate-700 px-2.5 py-0.5 rounded-md font-semibold text-emerald-400">${item.source || 'Genel'}</span>
                <span>${new Date(item.pubDate).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}</span>
              </div>
              <h2 class="text-base font-semibold text-slate-100 group-hover:text-emerald-400 transition line-clamp-2 mb-2">
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
              </h2>
              ${item.description ? `<p class="text-xs text-slate-400 line-clamp-3 mb-4">${item.description.replace(/<[^>]*>?/gm, '')}</p>` : ''}
            </div>
            <div class="pt-3 border-t border-slate-700/50 flex justify-end">
              <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-emerald-400 font-medium inline-flex items-center gap-1 transition">
                Habere Git <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>
          </article>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="col-span-full text-center py-10 text-rose-400">Hata: ' + err.message + '</div>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => loadNews(e.target.value.trim()), 300);
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');
      loadNews().finally(() => setTimeout(() => icon.classList.remove('fa-spin'), 600));
    });

    document.getElementById('syncRssBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncRssBtn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Taranıyor...';
      try {
        await fetch('/api/sync');
        setTimeout(() => {
          loadNews();
          btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down mr-1"></i>Kaynakları Şimdi Tara';
        }, 2500);
      } catch (e) {
        btn.innerHTML = 'Hata!';
      }
    });

    loadNews();
  </script>
</body>
</html>
