<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Haber Takip</title>
<meta http-equiv="Content-Security-Policy" 
      content="default-src 'self'; 
               script-src 'self'; 
               style-src 'self' 'unsafe-inline'; 
               img-src 'self' https: data:; 
               connect-src 'self' https:; 
               font-src 'self' https: data:;">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #e6eaf0;
      --bg-card: #e6eaf0;
      --shadow-dark: rgba(163,177,198,0.55);
      --shadow-light: rgba(255,255,255,0.9);
      --text: #3d4457;
      --text-muted: #7a8299;
      --accent: #4a90e2;
      --warning: #f5a623;
      --danger: #e04b4b;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30,34,40,0.55);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.open { display: flex; }

    /* ================ Neumorphism yardımcı sınıflar ================ */
    .neu-raised {
      background: var(--bg);
      box-shadow: 7px 7px 15px var(--shadow-dark), -7px -7px 15px var(--shadow-light);
    }
    .neu-pressed {
      background: var(--bg);
      box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
    }

    /* ================ KARANLIK MOD ================ */
    body.dark-mode {
      --bg: #22252b;
      --bg-card: #22252b;
      --shadow-dark: rgba(0,0,0,0.55);
      --shadow-light: rgba(255,255,255,0.04);
      --text: #e8e8e8;
      --text-muted: #9a9fab;
      background: var(--bg);
      color: var(--text);
    }
    body.dark-mode .top-bar,
    body.dark-mode .tabs,
    body.dark-mode .news-card,
    body.dark-mode .modal-content,
    body.dark-mode .tracking-panel,
    body.dark-mode .tracking-wrapper {
      background: var(--bg);
      color: var(--text);
    }
    body.dark-mode .tab-btn { background: var(--bg); color: var(--text-muted); }
    body.dark-mode .tab-btn.active { color: #fff; }
    body.dark-mode input,
    body.dark-mode select {
      background: var(--bg);
      color: var(--text);
    }
    body.dark-mode .news-snippet,
    body.dark-mode .news-desc { color: #b7bcc8; }
    body.dark-mode .news-date,
    body.dark-mode .pub-date { color: var(--text-muted); }
    body.dark-mode .news-card.read { opacity: 0.5; }
    body.dark-mode .version-tag { background: var(--bg); color: var(--text-muted); }
    body.dark-mode #status { background: var(--bg); color: var(--text-muted); }
    body.dark-mode .keyword-chip { background: var(--bg); color: var(--text); }

    /* ================ UST BAR ================ */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--bg);
      box-shadow: 0 6px 16px rgba(163,177,198,0.35);
      flex-wrap: wrap;
    }
    .top-bar h1 {
      font-size: 18px;
      margin: 0;
      margin-right: 10px;
      white-space: nowrap;
      color: var(--text);
    }
    .version-tag {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      background: var(--bg);
      box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
      padding: 3px 10px;
      border-radius: 12px;
      vertical-align: middle;
      margin-left: 4px;
    }

    #searchInput, #sourceFilter {
      padding: 10px 14px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
      outline: none;
    }
    #searchInput { flex: 1; min-width: 150px; }
    #sourceFilter { min-width: 140px; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      transition: box-shadow 0.15s, transform 0.1s;
    }
    button:hover { transform: translateY(-1px); }
    button:active {
      box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
      transform: translateY(0);
    }

    .btn-icon { font-size: 14px; }
    .btn-primary { color: var(--accent); font-weight: 600; }
    .btn-warning { color: var(--warning); font-weight: 600; }
    .btn-danger { color: var(--danger); font-weight: 600; }
    #refreshIcon { display: inline-block; }
    #refreshIcon.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ================ KATEGORI SEKMELERI ================ */
    .tabs {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: var(--bg);
      overflow-x: auto;
    }
    .tab-btn {
      white-space: nowrap;
      background: var(--bg);
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: 18px;
      font-weight: 500;
      box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
      border: none;
    }
    .tab-btn.active {
      color: var(--accent);
      box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
      font-weight: 700;
    }

    /* ================ DURUM CUBUGU ================ */
    #status {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg);
    }

    /* ================ HABER LISTESI ================ */
    #newsList {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .news-card {
      background: var(--bg);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: none;
      transition: box-shadow 0.2s;
    }
    .news-card.read { opacity: 0.55; }
    .news-header { display: flex; justify-content: space-between; align-items: center; }
    .news-source {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }
    .star-btn {
      background: var(--bg);
      font-size: 16px;
      padding: 6px 9px;
      border-radius: 10px;
      box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
    }
    .news-title {
      font-size: 15px;
      font-weight: 700;
      color: inherit;
      text-decoration: none;
      line-height: 1.4;
    }
    .news-title:hover { color: var(--accent); }
    .news-date { font-size: 12px; color: var(--text-muted); }
    .news-snippet { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.4; }
    .empty-msg { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px; }

    /* ================ MODAL (KAYNAK YONETIMI) ================ */
    .modal-content {
      background: var(--bg);
      border-radius: 22px;
      padding: 24px;
      width: 450px;
      max-width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 12px 12px 28px rgba(0,0,0,0.35), -8px -8px 20px var(--shadow-light);
    }
    .modal-content h2 { margin-top: 0; font-size: 18px; color: var(--text); }
    .modal-content label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 12px 0 6px;
      color: var(--text-muted);
    }
    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
      box-sizing: border-box;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; }

    .source-list-title {
      margin-top: 22px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      padding-top: 14px;
      box-shadow: inset 0 1px 0 var(--shadow-light);
    }
    .source-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      font-size: 13px;
    }
    .source-row button {
      background: var(--bg);
      font-size: 14px;
      padding: 5px 9px;
      border-radius: 8px;
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    }

    /* ================ HABER TAKIP (KEYWORD) STILLERI ================ */
    .tracking-panel, .tracking-wrapper {
      grid-column: 1 / -1;
      background: var(--bg);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 8px;
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
    }

    .tracking-input-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .tracking-input-row input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
    }

    .tracking-keyword-list, .tracked-keywords-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .keyword-chip {
      background: var(--bg);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
    }
    .chip-remove, .remove-kw-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      padding: 0 2px;
      color: var(--text-muted);
      box-shadow: none;
    }
    .chip-remove:hover, .remove-kw-btn:hover { color: var(--danger); }

    /* ============ HABER TAKİP EŞLEŞME (Neumorphism amber vurgu) ============ */
    .news-card.tracked-match {
      background: var(--bg);
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light), inset 0 0 0 2px rgba(245,166,35,0.55);
      position: relative;
    }
    .news-card.tracked-match::before {
      content: "";
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: -3px;
      width: 5px;
      background: var(--warning);
      border-radius: 5px;
      box-shadow: 2px 0 6px rgba(245,166,35,0.5);
    }
    .tracked-match-badge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      flex-wrap: wrap;
      gap: 5px;
      margin: 5px 0;
      padding: 6px 12px;
      border-radius: 14px;
      background: var(--bg);
      color: #b45f00;
      font-size: 12px;
      font-weight: 700;
      box-shadow: inset 3px 3px 7px rgba(245,166,35,0.25), inset -3px -3px 7px var(--shadow-light);
    }
    body.dark-mode .tracked-match-badge { color: #ffbe3d; }
    .tracked-match-badge strong { color: var(--warning); }
    .tracked-bell { font-size: 13px; }
    .news-card.tracked-match.read { opacity: 0.72; }

    .tracking-matches { display: grid; gap: 14px; margin-top: 14px; }
    .match-card {
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light), inset 3px 0 0 var(--warning);
    }
    .matched-kw { font-size: 12px; color: var(--warning); font-weight: 700; margin-left: auto; }

    /* ============ EKSİK KART STİLLERİ (renderer.js ile uyumlu) ============ */
    .source-logo { width: 20px; height: 20px; border-radius: 6px; object-fit: contain; margin-right: 6px; vertical-align: middle; }
    .source-name { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-right: 8px; }
    .pub-date { font-size: 12px; color: var(--text-muted); }
    .news-desc { font-size: 13px; color: var(--text-muted); margin: 8px 0; line-height: 1.4; }
    .news-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .fav-btn {
      background: var(--bg);
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 10px;
      box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
    }
    .fav-btn.active { color: var(--warning); font-weight: 700; }
    .read-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
    }
       .read-link:hover { box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light); }

    .category-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- ================ UST BAR ================ -->
  <div class="top-bar">
    <h1>📰 Haber Takip <span id="appVersion" class="version-tag"></span></h1>
    <input type="text" id="searchInput" placeholder="🔍 Başlıkta ara..." />
    <select id="sourceFilter">
      <option value="all">Tüm Kaynaklar</option>
       </select>
    <button id="darkModeToggle" class="btn-icon">🌙 Karanlık Mod</button>
    <button id="exportBtn" class="btn-icon">💾 Dışa Aktar</button>
    <button id="addSourceBtn" class="btn-primary">+ Kaynak</button>
    <button id="refreshBtn" class="btn-icon"><span id="refreshIcon">🔄</span> Yenile</button>
    <button id="openTickerBtn" class="btn-primary">📺 Haber Bandını Aç</button>
    <button id="tickerSettingsBtn" class="btn-icon">⚙️ Ticker Ayarları</button>
  </div>

  <!-- ================ KATEGORI SEKMELERI ================ -->
  <div class="tabs" id="tabs"></div>

  <!-- ================ DURUM CUBUGU ================ -->
  <div id="status">Yükleniyor...</div>

  <!-- ================ HABER LISTESI ================ -->
  <div id="newsList"></div>

  <!-- ================ KAYNAK YONETIM MODALI ================ -->
  <div class="modal-overlay" id="sourceModal">
    <div class="modal-content">
      <h2 id="modalTitle">Yeni Kaynak Ekle</h2>

      <label>Kategori</label>
      <input type="text" id="modalCategory" list="categoryList" placeholder="Örn: Ekonomi" />
      <datalist id="categoryList"></datalist>

      <label>Kaynak Adı</label>
      <input type="text" id="modalName" placeholder="Örn: Hürriyet" />

      <label>Kaynak Türü</label>
      <select id="modalType">
        <option value="rss">RSS</option>
        <option value="html">HTML / Web Sitesi</option>
      </select>

      <label>Kaynak URL</label>
      <input type="text" id="modalUrl" placeholder="https://..." />

      <label>Logo URL <span style="font-weight: normal;">(isteğe bağlı)</span></label>
      <input type="text" id="modalLogo" placeholder="Boş bırakılırsa favicon kullanılır" />

      <div id="htmlSelectorFields" style="display: none;">
        <label>Haber Kapsayıcı Seçicisi</label>
        <input type="text" id="modalItemSelector" placeholder="Örn: article veya .news-item" />

        <label>Başlık Seçicisi</label>
        <input type="text" id="modalTitleSelector" placeholder="Örn: h2 a veya .title a" />

        <label>Bağlantı Seçicisi</label>
        <input type="text" id="modalLinkSelector" placeholder="Örn: h2 a veya a" />

        <label>Özet Seçicisi</label>
        <input type="text" id="modalDescriptionSelector" placeholder="Örn: p veya .summary" />

        <label>Tarih Seçicisi</label>
        <input type="text" id="modalDateSelector" placeholder="Örn: time veya .date" />
      </div>

      <div class="modal-actions">
        <button id="modalCancelBtn">Vazgeç</button>
        <button id="modalSaveBtn" class="btn-primary">Ekle</button>
      </div>

      <div class="source-list-title">Kayıtlı Kaynaklar</div>
      <div id="sourceListContainer"></div>
    </div>
  </div>
  <!-- ================ TICKER AYARLARI MODALI ================ -->
  <div class="modal-overlay" id="tickerSettingsModal">
    <div class="modal-content">
      <h2>Ticker (Haber Bandı) Ayarları</h2>

      <label>Gösterilecek Haber Kaynakları</label>
      <div id="tickerSourceList" style="max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:16px;">
      </div>

      <label for="tickerSpeedSelect">Akış Hızı</label>
      <select id="tickerSpeedSelect">
        <option value="slow">Yavaş</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Hızlı</option>
      </select>

      <div class="modal-actions">
        <button id="tickerSettingsCancelBtn">Vazgeç</button>
        <button id="tickerSettingsSaveBtn" class="btn-primary">Kaydet</button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
